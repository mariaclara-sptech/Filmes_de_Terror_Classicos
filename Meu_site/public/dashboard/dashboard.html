<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Vintage Frights | Filmes</title>
    

    <link rel="stylesheet" href="/css/pagina.geral.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:ital@0;1&display=swap"
        rel="stylesheet">

    <link rel="shortcut icon" href="../assets/img/logo.png" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/js/sessao.js"></script>

</head>

<body onload="carregarFilmes()">

    <div class="sidebar">

        <div>

            <div class="logo">

                <img src="/assets/img/logo.png" class="logo-img">

                <h1>Vintage Frights</h1>

            </div>

            <div class="menu">

                <a href="./dashboard.html" class="ativo">
                    DASHBOARD
                </a>
                <a href="./pontuacao.html" class="ativo">
                    DADOS VOTAÇÃO
                </a>
                <a href="../detalhes.html" class="ativo">
                    INFORMAÇÕES
                </a>


            </div>

        </div>
        <a href="/linha.html">
            <button>

                SAIR
            </button>
        </a>

    </div>

    <div class="main">

        <div class="topo">

            <div class="kpi">
                <span>FILME FAVORITO</span>
                <h2 id="favoritoFilme">-</h2>
            </div>

            <div class="kpi">
                <span>SUA PONTUAÇÃO NO QUIZ</span>
                <h2 id="pontuacaoQuiz">0</h2>
            </div>

            <div class="kpi">
                <span>RANKING</span>
                <h2 id="rankingQuiz">#0</h2>
            </div>

        </div>

        <div class="meio">

            <div class="grafico-box">

                <h3>MÉDIA DOS FILMES</h3>

                <canvas id="graficoMedia"></canvas>

            </div>

            <div class="grafico-box">

                <h3>VOCÊ VS COMUNIDADE</h3>

                <canvas id="graficoComparacao"></canvas>

            </div>

        </div>

        <div class="baixo">

            <div class="mini-box">

                <h3>SEU TOP 3</h3>

                <div id="topUsuario"></div>

            </div>

            <div class="mini-box">

                <h3>TOP COMUNIDADE</h3>

                <div id="topComunidade"></div>

            </div>

        </div>

    </div>

    <script>

        function carregarFilmes() {

            validarSessao()
            carregarGraficos()
            carregarRankingQuiz()
            carregarPontuacao()

        }

        function carregarPontuacao() {

            let idUsuario = sessionStorage.getItem('ID_USUARIO')
            let elementoPontuacao = document.getElementById('pontuacaoQuiz')

            if (!idUsuario) {
                elementoPontuacao.innerText = 0
                return
            }

            fetch(`/quiz/pontuacao/${idUsuario}`)

                .then(function (resposta) {

                    if (!resposta.ok) {
                        return { pontuacao: 0 }
                    }

                    return resposta.json()

                })

                .then(function (dados) {

                    elementoPontuacao.innerText = Number(dados.pontuacao) || 0

                })

                .catch(function () {

                    elementoPontuacao.innerText = 0

                })

        }

        function carregarRankingQuiz() {

            fetch("/quiz/ranking")

                .then(function (resposta) {

                    return resposta.json()

                })

                .then(function (dados) {

                    for (let i = 0; i < dados.length; i++) {

                        if (dados[i].nome == sessionStorage.NOME_USUARIO) {

                            rankingQuiz.innerHTML = `#${i + 1}`
                            break

                        }

                    }

                })

        }

        function carregarGraficos() {

            let idUsuario = sessionStorage.ID_USUARIO

            Promise.all([

                fetch(`/votos/usuario/${idUsuario}`).then(function (r) {
                    return r.json()
                }),

                fetch(`/votos/media/filmes`).then(function (r) {
                    return r.json()
                })

            ])

                .then(function (respostas) {

                    let votosUsuario = respostas[0]
                    let votosMedia = respostas[1]

                    let filmes = [
                        "Alien",
                        "Chuck",
                        "Donnie Darko",
                        "O Exorcista",
                        "Gremlins",
                        "Halloween",
                        "Hellraiser",
                        "Scream",
                        "Tubarão",
                        "Frankenstein",
                        "Godzilla"
                    ]

                    let usuarioContagem = {
                        "Alien": 0,
                        "Chuck": 0,
                        "Donnie Darko": 0,
                        "O Exorcista": 0,
                        "Gremlins": 0,
                        "Halloween": 0,
                        "Hellraiser": 0,
                        "Scream": 0,
                        "Tubarão": 0,
                        "Frankenstein": 0,
                        "Godzilla": 0

                    }

                    for (let i = 0; i < votosUsuario.length; i++) {

                        usuarioContagem[votosUsuario[i].nome] =
                            votosUsuario[i].nota

                    }

                    let filmesUsuario = []

                    for (let i = 0; i < filmes.length; i++) {

                        filmesUsuario.push({
                            nome: filmes[i],
                            nota: usuarioContagem[filmes[i]]
                        })

                    }

                    filmesUsuario.sort(function (a, b) {
                        return b.nota - a.nota
                    })

                    favoritoFilme.innerHTML = filmesUsuario[0].nome

                    topUsuario.innerHTML = ""

                    for (let i = 0; i < 3; i++) {

                        topUsuario.innerHTML += `
                    <p>
                        ${i + 1}. 
                        ${filmesUsuario[i].nome} 
                        ★ ${filmesUsuario[i].nota}
                    </p>
                `

                    }

                    votosMedia.sort(function (a, b) {
                        return b.media - a.media
                    })

                    topComunidade.innerHTML = ""

                    for (let i = 0; i < 3; i++) {

                        topComunidade.innerHTML += `
                    <p>
                        ${i + 1}. 
                        ${votosMedia[i].filme} 
                        ★ ${Number(votosMedia[i].media).toFixed(1)}
                    </p>
                `

                    }
                    

                    new Chart(graficoMedia, {

                        type: 'bar',

                        data: {

                            labels: votosMedia.map(function (f) {
                                return f.filme
                            }),

                            datasets: [{

                                label: "Comunidade",

                                data: votosMedia.map(function (f) {
                                    return Number(f.media) || 0
                                }),
                                

                                // borderColor: "#FFFFFF",

                                tension: .4

                            }]

                        },

                        options: {
                                backgroundColor: "#8b0000",
                                borderColor: "#FFFFFF",
                            scales: {

                                y: {

                                    min: 0,

                                    max: 5,

                                    ticks: {

                                        stepSize: 1
                                    }

                                }

                            }

                        }

                    })

                    new Chart(graficoComparacao, {

                        type: 'line',

                        data: {

                            labels: filmes,

                            datasets: [

                                {

                                    label: "Você",

                                    data: filmesUsuario.map(function (f) {
                                        return f.nota
                                    }),

                                    borderColor: "red"

                                },

                                {

                                    label: "Comunidade",

                                    data: votosMedia.map(function (f) {
                                        return f.media
                                    }),

                                    borderColor: "white"

                                }

                            ]

                        },

                        options: {

                            scales: {

                                y: {

                                    min: 0,

                                    max: 5,

                                    ticks: {

                                        stepSize: 1
                                    }

                                }

                            }

                        }

                    })

                })

        }

    </script>
</body>

</html>
