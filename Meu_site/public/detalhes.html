<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Vintage Frights | Informações</title>

    <link rel="stylesheet" href="/css/detalhes.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:ital@0;1&display=swap"
        rel="stylesheet">

</head>

<body onload="carregar()">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <div>

            <div class="logo">

                <img src="/assets/img/logo.png" class="logo-img">

                <h1>Vintage Frights</h1>

            </div>

            <div class="menu">

                <a href="./dashboard/dashboard.html">
                    DASHBOARD
                </a>

                <a href="./dashboard/pontuacao.html">
                    DADOS VOTACAO
                </a>

                <a href="../detalhes.html" class="ativo">
                    INFORMACOES
                </a>

            </div>

        </div>

        <a href="/linha.html">
            <button>SAIR</button>
        </a>

    </div>

    <!-- CONTEUDO -->

   <div class="main">

    <h1 class="titulo">SELECIONE UM FILME</h1>

    <select id="select_filme" onchange="mostrar()">
        <option value="">Escolha um filme</option>
    </select>

   <div class="resultado">

    <div class="topo-filme">

        <img id="imgFilme">

        <div class="info-filme">

            <h2 id="tituloFilme"></h2>

            <p id="dataFilme"></p>

            <p id="generoFilme"></p>

            <p id="diretorFilme"></p>

            <p id="elencoFilme"></p>

        </div>

    </div>

    <div class="detalhes-filme">

        <h3>ENREDO</h3>
        <p id="enredoFilme"></p>

        <h3>CURIOSIDADES</h3>
        <p id="curiosidadesFilme"></p>

        <h3>IMPACTO</h3>
        <p id="impactoFilme"></p>

        <h3>FILMES PARECIDOS</h3>
        <p id="parecidosFilme"></p>

    </div>

</div>

    </div>

    <script src="/js/dadosFilmes.js"></script>

    <script>

        function carregar() {

            select_filme.innerHTML =
                "<option value=''>Escolha um filme</option>";

            for (let i = 0; i < filmes.length; i++) {

                select_filme.innerHTML += `
                    <option value="${i}">
                        ${filmes[i].titulo}
                    </option>
                `;
            }
        }

        function mostrar() {

            let indice = select_filme.value;

            if (indice == "") {
                limpar();
                return;
            }

            let filme = filmes[indice];

            imgFilme.src = filme.img;

            tituloFilme.innerHTML = filme.titulo;

            dataFilme.innerHTML =
                "Ano: " + filme.data;

            generoFilme.innerHTML =
                "Gênero: " + filme.genero;

            diretorFilme.innerHTML =
                "Diretor: " + filme.diretor;

            elencoFilme.innerHTML =
                "Elenco: " + filme.elenco;

            enredoFilme.innerHTML =
                filme.enredo;

            curiosidadesFilme.innerHTML =
                filme.curiosidades;

            impactoFilme.innerHTML =
                filme.impacto;

            parecidosFilme.innerHTML =
                filme.parecidos;
        }

        function limpar() {

            imgFilme.src = "";

            tituloFilme.innerHTML = "";

            dataFilme.innerHTML = "";

            generoFilme.innerHTML = "";

            diretorFilme.innerHTML = "";

            elencoFilme.innerHTML = "";

            enredoFilme.innerHTML = "";

            curiosidadesFilme.innerHTML = "";

            impactoFilme.innerHTML = "";

            parecidosFilme.innerHTML = "";
        }

    </script>

</body>

</html>
